services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: interviewly-app
    restart: unless-stopped
    ports:
      - "3000:3000"
      # Expose RTC port range for WebRTC (UDP and TCP)
      # Current range: 60000-60100 (100 ports = ~50 concurrent connections)
      # To use full range 40000-49999, uncomment the lines below and comment the current range
      # Note: Ensure ports in the range are not in use by other services
      - "60000-60100:60000-60100/udp"
      - "60000-60100:60000-60100/tcp"
      # Full range (uncomment if needed and ports are available):
      # - "40000-49999:40000-49999/udp"
      # - "40000-49999:40000-49999/tcp"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST_NAME=0.0.0.0
      - NEXT_PUBLIC_APP_URL=https://interviewly.live
      - NEXT_PUBLIC_SFU_URL=https://interviewly.live
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      - MEDIASOUP_ANNOUNCED_IP=interviewly.live
      # RTC port range - update these if you change the port range above
      - MEDIASOUP_RTC_MIN_PORT=60000
      - MEDIASOUP_RTC_MAX_PORT=60100
      # For full range, use:
      # - MEDIASOUP_RTC_MIN_PORT=40000
      # - MEDIASOUP_RTC_MAX_PORT=49999
    volumes:
      - ./uploads:/app/uploads
    networks:
      - interviewly-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: interviewly-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/ssl:/etc/nginx/ssl
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    environment:
      - SSL_EMAIL=${SSL_EMAIL:-admin@interviewly.live}
    depends_on:
      - app
    networks:
      - interviewly-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  interviewly-network:
    driver: bridge

volumes:
  certbot-data:
  certbot-www:
